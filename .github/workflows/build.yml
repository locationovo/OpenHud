name: Build OpenHud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $(whoami) /opt/theos

      - name: Clean Build Artifacts
        run: |
          rm -rf .theos
          rm -rf theos
          make clean THEOS=/opt/theos || true

      - name: Build Package
        run: make package THEOS=/opt/theos

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenHud-deb
          path: packages/*.deb
